name: Compile Debug

on:
  push:
    branches:
      - main
  workflow_dispatch: { }

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Echo-Video-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: "v3.0-video-${{ github.run_number }}"
          name: "Echo Nightly with Video Extension & Player (Build ${{ github.run_number }})"
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            ### Echo Nightly with Video Extension & Video Player
            - Added **Video Extension Support** (`ExtensionType.VIDEO`)
            - Built-in **Offline Videos Extension** (browse & play all local videos on device)
            - Full **Video Player** with interactive touch controls, aspect ratio modes (Fit, Zoom, Stretch)
            - **Video-to-Audio Mode Toggle** (Play video as audio in background/screen off with video surface detached)
            - **Picture-in-Picture (PiP)** floating playback
            - **Playback Speed Control** (0.5x to 2.0x)
            - Landscape **Fullscreen Mode**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

